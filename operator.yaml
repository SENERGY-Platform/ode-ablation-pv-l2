# The operator as the analytics stack registers it (§5.14).
#
# ODE offers registration as an explicit action and never performs it on its own,
# so this file is the payload that action sends. Edit it here; it is the source of
# truth for what the pipeline editor will show.
name: ode-ablation-pv-l2
description: Day-ahead PV generation forecast (hourly mean, W) from archived Open-Meteo forecasts
image: ghcr.io/senergy-platform/ode-ablation-pv-l2:latest

# Public makes the operator visible to other users of the platform. Registration
# is a developer decision and so is this.
pub: false
deploymentType: local

# What the pipeline editor offers as inputs. Each name has to match a selector
# arg in op.py; the selectors are "pv" (the PV series), "forecast" (the Open-Meteo
# previous-runs archive, all eight fields from one import) and "history" (the
# Open-Meteo weather history, obs_* fields: diagnostic, training only, removable
# once the observed-weather ceiling is known).
inputs:
  - name: pv
    type: float
  - name: shortwave_radiation
    type: float
  - name: direct_radiation
    type: float
  - name: diffuse_radiation
    type: float
  - name: direct_normal_irradiance
    type: float
  - name: cloud_cover
    type: float
  - name: temperature_2m
    type: float
  - name: forecasted_for
    type: string
  - name: lead_days
    type: int
  - name: obs_shortwave_radiation
    type: float
  - name: obs_direct_radiation
    type: float
  - name: obs_diffuse_radiation
    type: float
  - name: obs_cloudcover
    type: float
  - name: obs_temperature_2m
    type: float
  - name: obs_weather_time
    type: string

# What the operator emits, stamped with the hour the prediction is about.
outputs:
  - name: prediction
    type: float

# Deployment configuration, matching CustomConfig in op.py.
config_values:
  - name: retrain_after_s
    type: int
